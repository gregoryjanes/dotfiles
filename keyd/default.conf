# keyd: make Cmd on an Apple keyboard behave like macOS.
#
# Not stowed (keyd runs as root and reads /etc). Install with:
#   sudo install -Dm644 ~/dotfiles/keyd/default.conf /etc/keyd/default.conf
#   sudo keyd reload
#
# Panic button if a bad config locks the keyboard: backspace+escape+enter
# Note: keyd only accepts comments on their own lines.

[ids]
*

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Cmd is Ctrl for anything not listed here (Cmd+A/Z/S/F/T/W/L/R ...).
# Shift still passes through, so Cmd+Shift+Left selects to line start,
# Cmd+Shift+Z is redo, Cmd+Shift+T reopens a tab, and so on.
[cmd:C]
# Copy / paste / cut. The Insert/Delete variants work in GUI apps and in
# terminals, so the physical Ctrl+C stays free for SIGINT.
c = C-insert
v = S-insert
x = S-delete

# Line and document start/end
left = home
right = end
up = C-home
down = C-end

# Cmd+Backspace deletes to the start of the line
backspace = macro(S-home backspace)

# Cmd+Q quits, Cmd+Space opens KRunner (Spotlight)
q = A-f4
space = A-space

# Cmd+Tab switches apps, Cmd+` cycles windows of the current app
tab = swapm(app_switch, A-tab)
grave = A-grave

# Keeps Alt held while Cmd stays down so the switcher stays open;
# Cmd+Shift+Tab goes backwards.
[app_switch:A]

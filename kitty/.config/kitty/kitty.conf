# Fonts {{{
# Font family. You can also specify different fonts for the
# bold/italic/bold-italic variants. By default they are derived automatically,
# by the OSes font system. Setting them manually is useful for font families
# that have many weight variants like Book, Medium, Thick, etc. For example:
#
# You can get a list of full family names available on your computer by running
# kitty list-fonts
# The default values shown below rely on your OS to choose an appropriate monospace font family.
font_family        JetBrainsMono Nerd Font Mono
bold_font          auto
italic_font        Operator Mono Bold Italic
bold_italic_font   auto

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Font size (in pts)
# NOTE: Do not use odd values as these affect how kitty renders margin
font_size        11

dynamic_background_opacity yes

hide_window_decorations titlebar-only
window_padding_width 5

enable_audio_bell no

# Colors
include ./desolate_yellow.conf

background_opacity         0.95
dynamic_background_opacity yes

# tmux replacement {{{
# Everything below ports ~/.config/tmux/tmux.conf to native kitty features.
# Kitty "windows" = tmux panes, kitty "tabs" = tmux windows.

# Layouts: 'splits' gives tmux-style arbitrary splits, 'stack' is used for zoom
enabled_layouts splits,stack

# prefix 'C-a' (kitty multi-key sequences: press ctrl+a, release, then the key)
map ctrl+a>ctrl+a send_key ctrl+a

# split panes using | and -
map ctrl+a>shift+backslash launch --location=vsplit --cwd=current
map ctrl+a>minus           launch --location=hsplit --cwd=current

# switch panes using Alt-arrow without prefix (and prefix+arrow like tmux)
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map ctrl+a>left  neighboring_window left
map ctrl+a>right neighboring_window right
map ctrl+a>up    neighboring_window up
map ctrl+a>down  neighboring_window down

# resize panes (tmux prefix C-arrow)
map ctrl+a>ctrl+left  resize_window narrower
map ctrl+a>ctrl+right resize_window wider
map ctrl+a>ctrl+up    resize_window taller
map ctrl+a>ctrl+down  resize_window shorter

# other tmux defaults
map ctrl+a>o         next_window
map ctrl+a>semicolon nth_window -1
map ctrl+a>q         focus_visible_window
map ctrl+a>z         toggle_layout stack
map ctrl+a>x         close_window_with_confirmation
map ctrl+a>shift+1   detach_window new-tab
map ctrl+a>shift+[   move_window_backward
map ctrl+a>shift+]   move_window_forward
map ctrl+a>space     next_layout

map ctrl+a>c         new_tab_with_cwd
map ctrl+a>shift+7   close_tab
map ctrl+a>n         next_tab
map ctrl+a>p         previous_tab
map ctrl+a>l         goto_tab -1
map ctrl+a>w         select_tab
map ctrl+a>comma     set_tab_title
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# copy mode -> scrollback in a pager
map ctrl+a>[ show_scrollback

# reload config file
map ctrl+a>r load_config_file

# tmux-resurrect / tmux-continuum: kitty sessions
#   prefix C-s saves, prefix C-r restores, prefix s picks a session.
#   tab_bar.py also autosaves every 15 minutes, and startup_session restores
#   the autosave when kitty starts (like @continuum-restore 'on').
map ctrl+a>ctrl+s save_as_session --save-only ~/.local/share/kitty/autosave.kitty-session
map ctrl+a>ctrl+r goto_session ~/.local/share/kitty/autosave.kitty-session
map ctrl+a>s      goto_session
startup_session ~/.local/share/kitty/autosave.kitty-session

# don't do anything when a 'bell' rings
visual_bell_duration 0
window_alert_on_bell no
bell_on_tab ""

# borders (colors are in desolate_yellow.conf)
window_border_width   1pt
draw_minimal_borders  yes

# statusbar: bottom, left aligned, always shown, date/time on the right
tab_bar_edge         bottom
tab_bar_align        left
tab_bar_min_tabs     1
tab_bar_style        custom
tab_separator        ""
# keep the tab bar off the rounded window corners (outer edge, then gap to content)
tab_bar_margin_height 6.0 2.0
tab_bar_margin_width  8.0
tab_title_template        " {index} {title}{' Z' if layout_name == 'stack' else ''} "
# }}}
